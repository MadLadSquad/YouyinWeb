on:
  push:
    tags:
      - 'v*'
name: Create Release

permissions:
  contents: write

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Get tag
        shell: bash
        id: mod
        run: |
          tag="${{ github.ref_name }}"
          echo "out=youyin-web-${tag:1}" >> "$GITHUB_OUTPUT"
      # The site has no submodules or LFS objects since the move to Hugo, so the source archive is
      # simply the tagged tree. git archive leaves out .git and anything untracked, and fails loudly
      # instead of the old mv/tar steps that ignored their own errors.
      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="${{ steps.mod.outputs.out }}/" HEAD | xz -9 > "${{ steps.mod.outputs.out }}.tar.xz"
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            Check our discord for patch notes: https://discord.gg/4kyWu2Vu
            More on what is done this month can be found on the latest newsletter entry: https://madladsquad.com/#monthly-newsletter
          draft: false
          prerelease: false
          files: ${{ steps.mod.outputs.out }}.tar.xz
          generate_release_notes: false
