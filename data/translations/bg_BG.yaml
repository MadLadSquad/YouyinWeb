# privacy.html
privacy_policy_title:
  other: "Декларация за поверителност"
privacy_hero_eyebrow:
  other: "Поверителност и защита на данните"
privacy_hero_title:
  other: "Декларация за поверителност"
privacy_last_updated:
  other: "Последна актуализация: Септември 2026 г."
privacy_hero_lead:
  other: "{brand} е изграден с фокус върху поверителността и локалното съхранение на данни. Вашият напредък в обучението, създадените карти и настройките се съхраняват единствено на вашето собствено устройство и никога не се изпращат към външен сървър."
privacy_hl_local_title:
  other: "100% локално съхранение"
privacy_hl_local_desc:
  other: "Всички карти, фрази, статистики и серии живеят в IndexedDB на вашия браузър."
privacy_hl_noacct_title:
  other: "Без профили и регистрация"
privacy_hl_noacct_desc:
  other: "Използвайте {brand} свободно без създаване на профил, въвеждане на имейл или парола."
privacy_hl_notrack_title:
  other: "Без проследяване и реклами"
privacy_hl_notrack_desc:
  other: "Няма аналитични тракери, профилиращи скриптове или рекламни бисквитки."
privacy_hl_control_title:
  other: "Пълен контрол над данните"
privacy_hl_control_desc:
  other: "Експортирайте тестетата си в JSON или изтрийте всички локални данни с един клик по всяко време."
privacy_sec_controller_title:
  other: "1. Общ преглед и администратор на данни"
privacy_sec_controller_p1:
  other: "{brand} е уеб приложение с отворен код с образователна цел, създадено да помага при изучаването и упражняването на ръкописно писане на символи от различни писмени системи. Уебсайтът се управлява от Heapforge Ltd - дружество, регистрирано в Англия и Уелс. Heapforge Ltd е администратор на лични данни за този уебсайт съгласно Общия регламент за защита на данните на Обединеното кралство (UK GDPR) и Закона за защита на данните от 2018 г., а за посетители от Европейското икономическо пространство - съгласно Общия регламент за защита на данните на ЕС (Регламент (ЕС) 2016/679)."
privacy_sec_controller_p2:
  other: "Тъй като {brand} функционира като статично приложение от страна на клиента (client-side) без потребителски профили или сървърни бази данни, ние не събираме, не съхраняваме, не продаваме и не обработваме лични данни на отдалечен сървър."
privacy_controller_company_label:
  other: "Дружество"
privacy_controller_number_label:
  other: "Регистрационен номер (Companies House)"
privacy_controller_address_label:
  other: "Адрес на управление"
privacy_sec_controller_p3:
  other: "Тъй като до нас никога не достигат лични данни, Heapforge Ltd не е назначило длъжностно лице по защита на данните и не е определило представител в Европейското икономическо пространство по член 27 от GDPR на ЕС. Писмени запитвания могат да се изпращат на посочения по-горе адрес на управление; най-бързо отговаряме на въпроси по тази декларация през хранилището в GitHub, посочено в края ѝ."
privacy_sec_localdata_title:
  other: "2. Данни, съхранявани на вашето устройство"
privacy_sec_localdata_p1:
  other: "Всички данни от приложението, генерирани по време на вашето обучение, се записват локално в паметта на вашия браузър (IndexedDB и localStorage). Тези данни включват:"
privacy_sec_localdata_li1:
  other: "Карти и фрази: Определения на символи, произношение, избрани регионални варианти и създадени или импортирани от вас фрази."
privacy_sec_localdata_li2:
  other: "Статистика на обучението: История на преговорите, брой грешки, нива на знание, дневни серии, наличност на замразявания и спечелени диаманти."
privacy_sec_localdata_li3:
  other: "Календар на активността: Дневен брой сесии, използвани за показване на графиката на активността в страницата за профил."
privacy_sec_localdata_li4:
  other: "Потребителски настройки: Избрана цветова тема, език на интерфейса, модификатори на играта (като разширен режим и дневно намаляване на нивото) и статус на въвеждащия урок."
privacy_sec_localdata_p2:
  other: "Тази информация остава изцяло на вашето устройство. Тя никога не се предава към нас или към трети страни."
privacy_sec_thirdparty_title:
  other: "3. Технически данни и външни доставчици"
privacy_sec_thirdparty_p1:
  other: "Когато посещавате {brand}, вашият уеб браузър осъществява връзка с външни доставчици на инфраструктура, за да изтегли файловете на уебсайта, шрифтовете, данните за изписване на символи и публичните тестета. Тези доставчици могат да обработват технически данни за връзката (като вашия IP адрес, User-Agent на браузъра и времеви маркери на заявките) единствено с цел предаване на съдържание и сигурност на мрежата:"
privacy_sec_thirdparty_li1:
  other: "GitHub Pages (GitHub, Inc. / Microsoft): Статичен хостинг за файловете на уеб приложението."
privacy_sec_thirdparty_li2:
  other: "jsDelivr CDN (ProspectOne / Cloudflare): Мрежа за доставка на съдържание (CDN) за анимации на щрихи, бази данни със символи и публични тестета."
privacy_sec_thirdparty_li3:
  other: "Google Fonts (Google LLC): Доставка на шрифта с отворен код Ubuntu."
privacy_sec_thirdparty_p2:
  other: "Тези доставчици обработват технически метаданни съгласно своите политики за поверителност и приложимите за тях механизми за международен трансфер на данни (като Рамката за поверителност на данните между ЕС и САЩ и нейното разширение за Обединеното кралство, както и стандартните договорни клаузи)."
privacy_sec_legal_title:
  other: "4. Правно основание за обработване (чл. 6 от UK GDPR / GDPR на ЕС)"
privacy_sec_legal_p1:
  other: "Съгласно член 6, параграф 1 от UK GDPR и от GDPR на ЕС, ограниченото техническо обработване, необходимо за доставяне на уебсайта, се основава на:"
privacy_sec_legal_li1:
  other: "Член 6, параграф 1, буква „б“ (Изпълнение на договор / Предоставяне на услуга): Обработване на технически заявки, необходими за предоставяне на уеб приложението и интерактивните упражнения при вашето посещение."
privacy_sec_legal_li2:
  other: "Член 6, параграф 1, буква „е“ (Легитимен интерес): Легитимният интерес от поддържане на достъпност на уебсайта, бърза доставка чрез CDN, надеждност на системите и защита срещу мрежови атаки или злоупотреби."
privacy_sec_cookies_title:
  other: "5. Бисквитки и технологии за проследяване"
privacy_sec_cookies_p1:
  other: "{brand} не използва бисквитки за проследяване, аналитични бисквитки, таргетиращи бисквитки или рекламни скриптове на трети страни. Ние не проследяваме вашето поведение в други уебсайтове и не създаваме потребителски профили."
privacy_sec_cookies_p2:
  other: "Използваме стандартни технологии за съхранение от страна на клиента (IndexedDB, localStorage и Service Worker Cache API) единствено за строго необходима техническа функционалност — запазване на вашите тестета, нива на преговор, осигуряване на офлайн работа като прогресивно уеб приложение (PWA) и запаметяване на избраната тема и език. Съгласно Регламента за поверителност и електронни съобщения на Обединеното кралство от 2003 г. (PECR), Директивата за правото на неприкосновеност на личния живот в електронните съобщения (Директива 2002/58/ЕО) и UK GDPR / GDPR на ЕС, за строго необходимото функционално съхранение не се изисква банер за съгласие."
privacy_sec_rights_title:
  other: "6. Вашите права съгласно UK GDPR и GDPR на ЕС"
privacy_sec_rights_p1:
  other: "UK GDPR - а ако се намирате в Европейското икономическо пространство, GDPR на ЕС - ви предоставя конкретни права относно вашите данни:"
privacy_sec_rights_li1:
  other: "Право на достъп (чл. 15): Можете да прегледате всички данни за напредъка си директно в страниците „Тесте“ и „Профил“."
privacy_sec_rights_li2:
  other: "Право на коригиране (чл. 16): Имате пълен контрол да редактирате, поправяте или преименувате всяка карта, фраза, определение или настройка по всяко време директно в приложението."
privacy_sec_rights_li3:
  other: "Право на изтриване (чл. 17 - „Право да бъдеш забравен“): Можете да изтриете всички свои съхранени данни незабавно по всяко време чрез бутона „Изчистване на данните на профила“ в страницата „Профил“ или чрез изчистване на данните за сайта от браузъра."
privacy_sec_rights_li4:
  other: "Право на преносимост на данните (чл. 20): Можете да експортирате всички ваши тестета и фрази в машинночетим JSON формат по всяко време чрез опцията „Експортиране на тесте“ в страницата „Тесте“."
privacy_sec_rights_li5:
  other: "Право на ограничаване и възражение (чл. 18 и 21): Тъй като не се съхраняват лични данни на отдалечени сървъри, можете да прекратите всякаква локална обработка по всяко време, като затворите приложението или изчистите локалната памет."
privacy_sec_rights_li6:
  other: "Право на жалба (чл. 77): Водещият за нас надзорен орган е Службата на Информационния комисар на Обединеното кралство (ICO), с която можете да се свържете на ico.org.uk. Ако се намирате в Европейското икономическо пространство, можете вместо това да подадете жалба до надзорния орган във вашата държава (например Комисията за защита на личните данни в България - КЗЛД)."
privacy_sec_security_title:
  other: "7. Съхранение на данните и сигурност"
privacy_sec_security_p1:
  other: "Данните от вашето обучение остават записани в браузъра ви, докато не решите да ги изтриете, да нулирате профила си или да изчистите данните на браузъра. Тъй като данните се съхраняват локално в изолираната среда на браузъра и никога не се изпращат към централна база данни, те са защитени от централизирани пробиви в сигурността, а Heapforge Ltd никога не разполага с тяхно копие."
privacy_sec_children_title:
  other: "8. Защита на личните данни на деца"
privacy_sec_children_p1:
  other: "{brand} е сигурна образователна среда, подходяща за учащи от всички възрасти. Ние не събираме, не изискваме и не съхраняваме лична информация от деца или от които и да е други потребители, а тъй като няма профилиране, реклами или подтикващи механизми, приложението е изградено в съответствие с Кодекса за проектиране, съобразено с възрастта (Age Appropriate Design Code) на ICO."
privacy_sec_transfers_title:
  other: "9. Международни трансфери на данни"
privacy_sec_transfers_p1:
  other: "Външните доставчици на инфраструктура и CDN (GitHub, Google, Cloudflare) оперират глобални мрежи и центрове за данни. Доколкото технически метаданни за връзката се обработват извън Обединеното кралство или Европейското икономическо пространство (ЕИП), тези трансфери се уреждат от разпоредбите за адекватност на Обединеното кралство и от Споразумението за международен трансфер на данни (IDTA) или Допълнението на Обединеното кралство към стандартните договорни клаузи (SCC) на Европейската комисия, а за посетители от ЕИП - от SCC и решенията за адекватност, приети от Европейската комисия."
privacy_sec_contact_title:
  other: "10. Промени в декларацията и контакт"
privacy_sec_contact_p1:
  other: "Можем периодично да актуализираме тази Декларация за поверителност, за да отразим подобрения в приложението или правни промени. Всички актуализации ще бъдат публикувани на тази страница с нова дата на последна промяна."
privacy_sec_contact_p2:
  other: "Ако имате въпроси, обратна връзка или запитвания относно тази Декларация за поверителност или сигурността на {brand}, можете да пишете на Heapforge Ltd на адреса на управление, посочен в раздел 1, или да отворите тема в нашето официално хранилище в GitHub:"
privacy_contact_github:
  other: "Посетете {brand} в GitHub"
