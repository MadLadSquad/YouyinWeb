# privacy.html
privacy_policy_title:
  other: "Декларация за поверителност"
privacy_hero_eyebrow:
  other: "Поверителност и защита на данните"
privacy_hero_title:
  other: "Декларация за поверителност"
privacy_last_updated:
  other: "Последна актуализация: 5 октомври 2026 г."
privacy_hero_lead:
  other: "{brand} е изграден с фокус върху поверителността и локалното съхранение на данни. Вашият напредък в обучението, създадените карти и настройките се съхраняват единствено на вашето собствено устройство и никога не се изпращат към външен сървър."
privacy_hl_local_title:
  other: "100% локално съхранение"
privacy_hl_local_desc:
  other: "Всички карти, фрази, статистики и серии живеят в IndexedDB на вашия браузър."
privacy_hl_noacct_title:
  other: "Без профили и регистрация"
privacy_hl_noacct_desc:
  other: "Използвайте {brand} свободно без създаване на профил, въвеждане на имейл или парола."
privacy_hl_notrack_title:
  other: "Без проследяване и реклами"
privacy_hl_notrack_desc:
  other: "Няма аналитични тракери, профилиращи скриптове или рекламни бисквитки."
privacy_hl_control_title:
  other: "Пълен контрол над данните"
privacy_hl_control_desc:
  other: "Експортирайте тестетата си в JSON или изтрийте всички локални данни с един клик по всяко време."
privacy_intro:
  other: "Тази декларация за поверителност обяснява как Heapforge Ltd. („Heapforge“, „ние“, „нас“ или „наш“) събира, използва, споделя и защитава лични данни, когато посещавате {website}, използвате {brand} или се свързвате с нас по друг начин. В нея са описани и правата, които имате, и как да ги упражните."
privacy_s1_title:
  other: "1. Кои сме ние"
privacy_s1_p1:
  other: "Администратор на вашите лични данни е Heapforge Ltd., дружество, регистрирано в Англия и Уелс:"
privacy_controller_company_label:
  other: "Дружество"
privacy_controller_number_label:
  other: "Регистрационен номер"
privacy_controller_address_label:
  other: "Седалище и адрес на управление"
privacy_controller_contact_label:
  other: "Контакт по въпроси за поверителността"
privacy_s2_title:
  other: "2. Обхват"
privacy_s2_p1:
  other: "Тази декларация се отнася за личните данни, които обработваме чрез тази услуга, както и когато общувате с нас. Тя не се отнася за уебсайтове или услуги на трети страни, към които поставяме връзки – те имат свои собствени политики за поверителност."
privacy_s3_title:
  other: "3. Лични данни, които събираме"
privacy_s3_p1:
  other: "Стремим се да събираме само това, от което се нуждаем. В зависимост от начина, по който взаимодействате с нас, това може да включва:"
privacy_s3_li1:
  other: "Данни за контакт – например вашето име и имейл адрес, когато ни пишете или се свържете с нас по друг начин."
privacy_s3_li2:
  other: "Кореспонденция – съдържанието на съобщенията, които ни изпращате, включително прикачените файлове, и нашите отговори."
privacy_s3_li3:
  other: "Технически данни и данни за използването – например вашия IP адрес, вида на браузъра, информация за устройството, страниците, които заявявате, и датата и часа на посещението ви. Те се обработват автоматично, когато отваряте нашия уебсайт, основно с цел сигурност и за да ви бъде доставен сайтът."
privacy_s3_li4:
  other: "Данни за профил и транзакции – когато използвате платена услуга, информацията, необходима за предоставянето ѝ (например потвърждения за покупка). Ние не събираме и не съхраняваме пряко пълните данни на платежни карти."
privacy_s3_li5:
  other: "Всяка друга информация, която решите да ни предоставите."
privacy_s3_p2:
  other: "Не събираме умишлено специални категории данни (например данни за здравето, религиозни убеждения или биометрични данни). Моля, не ни изпращайте такава информация, освен ако изрично не сме я поискали."
privacy_s4_title:
  other: "4. Как използваме личните данни и на какво правно основание"
privacy_s4_p1:
  other: "Съгласно UK GDPR и GDPR на ЕС трябва да имаме правно основание за всяко използване на вашите лични данни."
privacy_s4_th_purpose:
  other: "Цел"
privacy_s4_th_basis:
  other: "Правно основание"
privacy_s4_row1_purpose:
  other: "Предоставяне на нашия уебсайт и услуги"
privacy_s4_row1_basis:
  other: "Законни интереси (поддържане на нашия уебсайт и дейност); договор, когато използвате нашите услуги"
privacy_s4_row2_purpose:
  other: "Защита на нашия уебсайт и услуги от злоупотреби, измами, ботове и атаки"
privacy_s4_row2_basis:
  other: "Законни интереси (сигурност на нашите услуги и потребители)"
privacy_s4_row3_purpose:
  other: "Отговаряне на вашите имейли и запитвания"
privacy_s4_row3_basis:
  other: "Законни интереси (комуникация с хората, които се свързват с нас); договор, когато запитването се отнася до услуга, която използвате или предстои да използвате"
privacy_s4_row4_purpose:
  other: "Предоставяне, управление и поддръжка на закупени от вас услуги"
privacy_s4_row4_basis:
  other: "Договор"
privacy_s4_row5_purpose:
  other: "Водене на търговска документация и изпълнение на правни, данъчни и регулаторни задължения"
privacy_s4_row5_basis:
  other: "Законово задължение"
privacy_s4_row6_purpose:
  other: "Установяване, упражняване или защита на правни претенции"
privacy_s4_row6_basis:
  other: "Законни интереси"
privacy_s4_row7_purpose:
  other: "Всяка цел, за която ви искаме съгласие"
privacy_s4_row7_basis:
  other: "Съгласие (което можете да оттеглите по всяко време)"
privacy_s4_p2:
  other: "Когато се основаваме на законни интереси, сме преценили дали тези интереси не са с по-малка тежест от вашите права и свободи. Можете да се свържете с нас за повече информация относно тази преценка."
privacy_s4_p3:
  other: "Ние не продаваме вашите лични данни."
privacy_s5_title:
  other: "5. Доставчици на услуги – трети страни"
privacy_s5_p1:
  other: "За осъществяване на дейността си използваме редица доверени доставчици на услуги. Те обработват лични данни от наше име и по наши указания и са обвързани с договорни задължения да ги защитават. Основните ни доставчици са изброени по-долу."
privacy_s5_1_title:
  other: "5.1 Cloudflare"
privacy_s5_1_p1:
  other: "Използваме услуги, предоставяни от Cloudflare, Inc., за хостинг, доставяне и защита на нашия уебсайт:"
privacy_s5_1_li1:
  other: "Сигурност и защита от ботове – Cloudflare проверява трафика към нашия уебсайт, за да го защити от атаки за отказ на услуга (DoS), автоматизирани ботове и друга злонамерена дейност. За целта анализира информация като IP адреси, характеристики на браузъра и устройството и данни за заявките и може да постави строго необходима бисквитка за сигурност."
privacy_s5_1_li2:
  other: "Хостинг на уебсайта – нашият уебсайт се предоставя чрез услугите за хостинг и периферни изчисления на Cloudflare (Cloudflare Pages и Workers), които обработват уеб заявки и друга техническа информация, за да ви доставят страниците."
privacy_s5_1_li3:
  other: "Доставяне на съдържание – статичните файлове, като изображения, скриптове и стилове, се съхраняват и доставят чрез услугата за съхранение и мрежата за доставка на съдържание на Cloudflare (Cloudflare R2)."
privacy_s5_1_p2:
  other: "Cloudflare поддържа глобална мрежа, така че вашите данни може да бъдат обработвани в центрове за данни близо до вашето местоположение, включително извън Обединеното кралство и ЕС. За повече информация вижте Политиката за поверителност на Cloudflare: {cloudflare_policy}"
privacy_s5_2_title:
  other: "5.2 Google Workspace"
privacy_s5_2_p1:
  other: "Използваме Google Workspace, предоставян от Google, като доставчик на имейл услуги. Когато ни пишете, вашето съобщение – включително вашето име, имейл адрес, съдържание на съобщението, прикачени файлове и свързаните метаданни – се получава, съхранява и обработва в системите на Google. Google обработва тези данни от наше име съгласно своите бизнес условия за обработване на данни и не използва данните на клиентите на Workspace за реклама."
privacy_s5_2_p2:
  other: "За повече информация вижте Политиката за поверителност на Google ({google_policy}) и Известието за поверителност на Google Cloud ({google_cloud_notice})."
privacy_s5_3_title:
  other: "5.3 Други получатели"
privacy_s5_3_p1:
  other: "Можем да споделяме някои лични данни и с:"
privacy_s5_3_li1:
  other: "професионални консултанти, като счетоводители, адвокати и застрахователи, когато е необходимо;"
privacy_s5_3_li2:
  other: "правоприлагащи органи, регулатори, съдилища или други органи, когато това се изисква по закон или за защита на нашите права, потребители или обществото;"
privacy_s5_3_li3:
  other: "купувач, правоприемник или инвеститор във връзка със сливане, придобиване, преструктуриране или продажба на цялата или част от дейността ни, при подходящи гаранции за поверителност."
privacy_s6_title:
  other: "6. Бисквитки и подобни технологии"
privacy_s6_p1:
  other: "Използваме само бисквитки и подобни технологии, които са строго необходими за сигурното функциониране на нашия уебсайт, например бисквитки за сигурност, които различават истинските посетители от автоматизирани ботове. Съгласно правото на Обединеното кралство и ЕС за тях не е необходимо вашето съгласие и ние не ги използваме, за да ви проследяваме в други уебсайтове."
privacy_s6_p2:
  other: "Ако въведем бисквитки, които не са от съществено значение (например за анализ или реклама), ще актуализираме тази декларация и, когато законът го изисква, ще поискаме съгласието ви, преди да ги поставим."
privacy_s7_title:
  other: "7. Международно предаване на данни"
privacy_s7_p1:
  other: "Ние сме установени в Обединеното кралство, а някои от нашите доставчици на услуги обработват данни в други държави, включително в Съединените щати."
privacy_s7_p2:
  other: "Когато лични данни се предават извън Обединеното кралство или Европейското икономическо пространство (ЕИП), гарантираме наличието на подходящи гаранции, като например:"
privacy_s7_li1:
  other: "предаване към държави, за които е признато, че осигуряват адекватно ниво на защита (регламенти/решения относно адекватното ниво на защита);"
privacy_s7_li2:
  other: "предаване към организации, сертифицирани по Рамката за защита на личните данни между ЕС и САЩ и нейното разширение за Обединеното кралство („UK-US data bridge“);"
privacy_s7_li3:
  other: "стандартни договорни клаузи, одобрени от Европейската комисия, заедно с Допълнението на Обединеното кралство за международно предаване на данни или Споразумението на Обединеното кралство за международно предаване на данни, когато е приложимо."
privacy_s7_p3:
  other: "Можете да се свържете с нас за повече информация относно гаранциите, които използваме."
privacy_s8_title:
  other: "8. Колко дълго съхраняваме личните данни"
privacy_s8_p1:
  other: "Съхраняваме лични данни само толкова дълго, колкото е необходимо за целите, описани в тази декларация, включително за изпълнение на правни, счетоводни или отчетни изисквания. Като общ ориентир:"
privacy_s8_li1:
  other: "Имейл кореспонденция – съхранява се 24 месеца след последния ни контакт, освен ако не се отнася до текущ въпрос или не трябва да я пазим по-дълго по правни причини."
privacy_s8_li2:
  other: "Журнали за сигурност и технически журнали – съхраняват се само за кратки периоди, доколкото е необходимо за сигурността и отстраняването на проблеми."
privacy_s8_li3:
  other: "Търговска документация и документи за транзакции – съхраняват се толкова дълго, колкото изисква законът (в Обединеното кралство обикновено до шест години след края на съответната финансова година)."
privacy_s8_p2:
  other: "Когато данните вече не са необходими, ние ги изтриваме или анонимизираме по сигурен начин."
privacy_s9_title:
  other: "9. Как защитаваме личните данни"
privacy_s9_p1:
  other: "Прилагаме подходящи технически и организационни мерки за защита на личните данни срещу неразрешен достъп, загуба, злоупотреба или промяна. Те включват криптиране при пренос, контрол на достъпа и избор на утвърдени доставчици със стабилни практики за сигурност. Нито един метод на пренос или съхранение обаче не е напълно сигурен и не можем да гарантираме абсолютна сигурност."
privacy_s9_p2:
  other: "Ако възникне нарушение на сигурността на личните данни, което е вероятно да изложи на риск вашите права, ще уведомим вас и съответните органи, както изисква законът."
privacy_s10_title:
  other: "10. Вашите права (Обединеното кралство, ЕС, ЕИП и Швейцария)"
privacy_s10_p1:
  other: "Ако се намирате в Обединеното кралство, ЕС, ЕИП или Швейцария, имате следните права при определени условия и изключения:"
privacy_s10_li1:
  other: "Достъп – да поискате копие от личните данни, които съхраняваме за вас."
privacy_s10_li2:
  other: "Коригиране – да поискате да коригираме неточни или непълни данни."
privacy_s10_li3:
  other: "Изтриване – да поискате да изтрием вашите данни в определени случаи."
privacy_s10_li4:
  other: "Ограничаване – да поискате да ограничим начина, по който използваме данните ви, в определени случаи."
privacy_s10_li5:
  other: "Преносимост на данните – да получите данните, които сте ни предоставили, в структуриран, широко използван формат или да ги прехвърлим на друга организация."
privacy_s10_li6:
  other: "Възражение – да възразите срещу обработване, основано на нашите законни интереси, и да възразите по всяко време срещу директен маркетинг."
privacy_s10_li7:
  other: "Оттегляне на съгласие – когато се основаваме на съгласие, можете да го оттеглите по всяко време, без това да засяга обработването преди оттеглянето."
privacy_s10_li8:
  other: "Да не бъдете обект на решения, основани единствено на автоматизирано обработване, които пораждат правни или подобно значими последици за вас."
privacy_s10_p2:
  other: "За да упражните някое от тези права, пишете ни на {email}. Ще отговорим в срок от един месец, който може да бъде удължен с още до два месеца при сложни искания. Може да се наложи да потвърдим самоличността ви, преди да отговорим. Упражняването на правата ви обикновено е безплатно."
privacy_s11_title:
  other: "11. Други държави"
privacy_s11_p1:
  other: "Ако живеете в друга държава, чието законодателство за защита на личните данни ви дава права върху тях, моля, свържете се с нас и ще ви отговорим в съответствие с приложимото към вас право."
privacy_s12_title:
  other: "12. Поверителност на децата"
privacy_s12_p1:
  other: "Нашият уебсайт и услуги не са насочени към деца под минималната възраст за даване на съгласие за обработване на данни и ние не събираме съзнателно лични данни от тях. Ако смятате, че дете ни е предоставило лични данни, моля, свържете се с нас и ние ще ги изтрием."
privacy_s13_title:
  other: "13. Автоматизирано вземане на решения"
privacy_s13_p1:
  other: "Не вземаме решения за вас, основани единствено на автоматизирано обработване, които пораждат правни или подобно значими последици. Автоматизираните инструменти за сигурност (например защитата от ботове) могат да блокират или да изискат допълнителна проверка при подозрителен трафик; ако смятате, че сте блокирани по погрешка, моля, свържете се с нас."
privacy_s14_title:
  other: "14. Връзки към други уебсайтове"
privacy_s14_p1:
  other: "Нашият уебсайт може да съдържа връзки към уебсайтове или услуги на трети страни. Ние не носим отговорност за техните практики за поверителност и ви препоръчваме да прочетете техните политики за поверителност."
privacy_s15_title:
  other: "15. Промени в тази декларация"
privacy_s15_p1:
  other: "Възможно е периодично да актуализираме тази декларация. Датата „Последна актуализация“ в началото показва кога е преработена за последен път. Ако направим съществени промени, ще предприемем разумни стъпки да ви уведомим, например чрез съобщение на нашия уебсайт."
privacy_s16_title:
  other: "16. Връзка с нас и жалби"
privacy_s16_p1:
  other: "Ако имате въпроси относно тази декларация или начина, по който обработваме личните ви данни, моля, свържете се с нас:"
privacy_s16_li1:
  other: "Имейл: {email}"
privacy_s16_li2:
  other: "Поща: Heapforge Ltd., {address}"
privacy_s16_p2:
  other: "Бихме искали първо да имаме възможност да разгледаме вашите опасения, но имате право да подадете жалба до орган за защита на данните:"
privacy_s16_li3:
  other: "Обединеното кралство: Службата на комисаря по информацията (ICO) – {ico}"
privacy_s16_li4:
  other: "ЕС/ЕИП: надзорният орган в държавата, в която живеете, работите или в която е извършено предполагаемото нарушение – списък е наличен на {edpb}"
privacy_s16_li5:
  other: "Други региони: вашият местен регулатор за защита на данните или поверителността."
