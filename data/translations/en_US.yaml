privacy_s5_1_title:
  other: "5.1 Cloudflare"
privacy_s5_1_p1:
  other: "We use services provided by Cloudflare, Inc. to host, deliver and protect our website:"
privacy_s5_1_li1:
  other: "Security and bot protection – Cloudflare screens traffic to our website to protect it against denial-of-service attacks, automated bots and other malicious activity. To do this, it analyses information such as IP addresses, browser and device characteristics and request details, and may set a strictly necessary security cookie."
privacy_s5_1_li2:
  other: "Website hosting – our website is served using Cloudflare's hosting and edge computing services (Cloudflare Pages and Workers), which process web requests and other technical information in order to deliver pages to you."
privacy_s5_1_li3:
  other: "Content delivery – static files such as images, scripts and stylesheets are stored and delivered using Cloudflare's storage and content delivery network (Cloudflare R2)."
privacy_s5_1_p2:
  other: "Cloudflare operates a global network, so your data may be processed in data centres close to your location, including outside the UK and EU. For more information, see Cloudflare's Privacy Policy: {cloudflare_policy}"
privacy_s5_2_title:
  other: "5.2 Google Workspace"
privacy_s5_2_p1:
  other: "We use Google Workspace, provided by Google, as our email provider. When you email us, your message – including your name, email address, message content, attachments and related metadata – is received, stored and processed on Google's systems. Google processes this data on our behalf under its business data processing terms and does not use Workspace customer data for advertising."
privacy_s5_2_p2:
  other: "For more information, see Google's Privacy Policy ({google_policy}) and Google Cloud Privacy Notice ({google_cloud_notice})."
privacy_s5_3_title:
  other: "5.3 Other recipients"
privacy_s5_3_p1:
  other: "We may also share some personal data with:"
privacy_s5_3_li1:
  other: "professional advisers such as accountants, lawyers and insurers, where necessary;"
privacy_s5_3_li2:
  other: "law enforcement, regulators, courts or other authorities, where required by law or to protect our rights, users or the public;"
privacy_s5_3_li3:
  other: "a buyer, successor or investor in connection with a merger, acquisition, restructuring or sale of all or part of our business, subject to appropriate confidentiality protections."
privacy_s6_title:
  other: "6. Cookies and similar technologies"
privacy_s6_p1:
  other: "We only use cookies and similar technologies that are strictly necessary for our website to function securely, such as security cookies to distinguish genuine visitors from automated bots. These do not require your consent under UK and EU law, and we do not use them to track you across other websites."
privacy_s6_p2:
  other: "If we introduce non-essential cookies (for example, for analytics or advertising), we will update this policy and, where required by law, ask for your consent before setting them."
privacy_s7_title:
  other: "7. International data transfers"
privacy_s7_p1:
  other: "We are based in the United Kingdom, and some of our service providers process data in other countries, including the United States."
privacy_s7_p2:
  other: "Where personal data is transferred outside the UK or the European Economic Area (EEA), we ensure appropriate safeguards are in place, such as:"
privacy_s7_li1:
  other: "transfers to countries recognised as providing an adequate level of protection (adequacy regulations/decisions);"
privacy_s7_li2:
  other: "transfers to organisations certified under the EU-U.S. Data Privacy Framework and its UK Extension (the “UK-US data bridge”);"
privacy_s7_li3:
  other: "Standard Contractual Clauses approved by the European Commission, together with the UK International Data Transfer Addendum or UK International Data Transfer Agreement, where applicable."
privacy_s7_p3:
  other: "You can contact us for more information about the safeguards we use."
privacy_s8_title:
  other: "8. How long we keep personal data"
privacy_s8_p1:
  other: "We keep personal data only for as long as necessary for the purposes described in this policy, including to meet legal, accounting or reporting requirements. As a general guide:"
privacy_s8_li1:
  other: "Email correspondence – kept for 24 months after our last contact, unless it relates to an ongoing matter or we need to keep it longer for legal reasons."
privacy_s8_li2:
  other: "Security and technical logs – kept for short periods only, as needed for security and troubleshooting."
privacy_s8_li3:
  other: "Business and transaction records – kept for as long as required by law (in the UK, typically up to six years after the end of the relevant financial year)."
privacy_s8_p2:
  other: "When data is no longer needed, we delete or anonymise it securely."
privacy_s9_title:
  other: "9. How we protect personal data"
privacy_s9_p1:
  other: "We use appropriate technical and organisational measures to protect personal data against unauthorised access, loss, misuse or alteration. These include encryption in transit, access controls and choosing reputable providers with strong security practices. No method of transmission or storage is completely secure, however, and we cannot guarantee absolute security."
privacy_s9_p2:
  other: "If a personal data breach occurs that is likely to put your rights at risk, we will notify you and the relevant authorities as required by law."
privacy_s10_title:
  other: "10. Your rights (UK, EU, EEA and Switzerland)"
privacy_s10_p1:
  other: "If you are in the UK, EU, EEA or Switzerland, you have the following rights, subject to certain conditions and exceptions:"
privacy_s10_li1:
  other: "Access – to request a copy of the personal data we hold about you."
privacy_s10_li2:
  other: "Rectification – to ask us to correct inaccurate or incomplete data."
privacy_s10_li3:
  other: "Erasure – to ask us to delete your data in certain circumstances."
privacy_s10_li4:
  other: "Restriction – to ask us to limit how we use your data in certain circumstances."
privacy_s10_li5:
  other: "Data portability – to receive data you provided to us in a structured, commonly used format, or have it transferred to another organisation."
privacy_s10_li6:
  other: "Objection – to object to processing based on our legitimate interests, and to object at any time to direct marketing."
privacy_s10_li7:
  other: "Withdraw consent – where we rely on consent, you may withdraw it at any time without affecting earlier processing."
privacy_s10_li8:
  other: "Not to be subject to solely automated decisions with legal or similarly significant effects."
privacy_s10_p2:
  other: "To exercise any of these rights, email us at {email}. We will respond within one month, which may be extended by up to two further months for complex requests. We may need to verify your identity before responding. Exercising your rights is usually free of charge."
privacy_s11_title:
  other: "11. Other countries"
privacy_s11_p1:
  other: "If you live in another country with privacy laws that give you rights over your personal data, please contact us and we will respond in accordance with the law that applies to you."
privacy_s12_title:
  other: "12. Children's privacy"
privacy_s12_p1:
  other: "Our website and services are not directed at children under the minimal age for data processing consent, and we do not knowingly collect personal data from them. If you believe a child has provided us with personal data, please contact us and we will delete it."
privacy_s13_title:
  other: "13. Automated decision-making"
privacy_s13_p1:
  other: "We do not make decisions about you based solely on automated processing that produce legal or similarly significant effects. Automated security tools (such as bot protection) may block or challenge suspicious traffic; if you believe you have been blocked in error, please contact us."
privacy_s14_title:
  other: "14. Links to other websites"
privacy_s14_p1:
  other: "Our website may contain links to third-party websites or services. We are not responsible for their privacy practices, and we encourage you to read their privacy policies."
privacy_s15_title:
  other: "15. Changes to this policy"
privacy_s15_p1:
  other: "We may update this policy from time to time. The “Last updated” date at the top shows when it was last revised. If we make significant changes, we will take reasonable steps to let you know, for example by a notice on our website."
privacy_s16_title:
  other: "16. Contact us and complaints"
privacy_s16_p1:
  other: "If you have any questions about this policy or how we handle your personal data, please contact us:"
privacy_s16_li1:
  other: "E-mail: {email}"
privacy_s16_li2:
  other: "Post: Heapforge Ltd., {address}"
privacy_s16_p2:
  other: "We would appreciate the chance to address your concerns first, but you have the right to complain to a data protection authority:"
privacy_s16_li3:
  other: "United Kingdom: Information Commissioner's Office (ICO) – {ico}"
privacy_s16_li4:
  other: "EU/EEA: the supervisory authority in the country where you live, work or where the alleged infringement took place – a list is available at {edpb}"
privacy_s16_li5:
  other: "Other regions: your local data protection or privacy regulator."
