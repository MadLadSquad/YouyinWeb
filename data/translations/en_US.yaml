# privacy.html
privacy_policy_title:
  other: "Privacy Policy"
privacy_hero_eyebrow:
  other: "Privacy & Data Protection"
privacy_hero_title:
  other: "Privacy Policy"
privacy_last_updated:
  other: "Last updated: September 2026"
privacy_hero_lead:
  other: "{brand} is built with a local-first, privacy-by-design architecture. Your learning progress, custom flashcards, and preferences are stored exclusively on your own device and are never transmitted to a remote server."
privacy_hl_local_title:
  other: "100% Local Storage"
privacy_hl_local_desc:
  other: "All cards, phrases, stats, and streak history live in your browser's IndexedDB."
privacy_hl_noacct_title:
  other: "No Accounts or Sign-up"
privacy_hl_noacct_desc:
  other: "Use {brand} freely without creating an account, providing an email, or setting a password."
privacy_hl_notrack_title:
  other: "No Tracking or Ads"
privacy_hl_notrack_desc:
  other: "Zero analytics trackers, zero profiling scripts, and zero advertising cookies."
privacy_hl_control_title:
  other: "Full Data Control"
privacy_hl_control_desc:
  other: "Export your decks to JSON or erase all local data in one click at any time."
privacy_sec_controller_title:
  other: "1. Overview & Data Controller"
privacy_sec_controller_p1:
  other: "{brand} is an open-source educational web application dedicated to helping people learn and practise handwriting characters from various writing systems. The website is operated by Heapforge Ltd, a company registered in England and Wales. Heapforge Ltd is the data controller for this website under the UK General Data Protection Regulation (UK GDPR) and the Data Protection Act 2018, and - for visitors in the European Economic Area - under the EU General Data Protection Regulation (Regulation (EU) 2016/679)."
privacy_sec_controller_p2:
  other: "Because {brand} operates as a static, client-side application without user accounts or server-side databases, we do not collect, store, sell, or process personal data on any remote server."
privacy_controller_company_label:
  other: "Company"
privacy_controller_number_label:
  other: "Companies House number"
privacy_controller_address_label:
  other: "Registered address"
privacy_sec_controller_p3:
  other: "Because no personal data ever reaches us, Heapforge Ltd has not appointed a data protection officer and has not designated a representative in the European Economic Area under Article 27 of the EU GDPR. Written enquiries can be sent to the registered address above; questions about this policy are answered fastest through the GitHub repository linked at the end of it."
privacy_sec_localdata_title:
  other: "2. Data Stored on Your Device"
privacy_sec_localdata_p1:
  other: "All application data generated during your learning journey is saved locally in your browser's persistent storage (IndexedDB and localStorage). This data includes:"
privacy_sec_localdata_li1:
  other: "Cards and Phrases: Character definitions, pronunciations, regional variant selections, and custom phrases you create or import."
privacy_sec_localdata_li2:
  other: "Study Statistics: Revision history, error counts, knowledge levels, daily streaks, streak freeze balances, and gem rewards."
privacy_sec_localdata_li3:
  other: "Activity Calendar: Daily session counts used to draw your practice heatmap on the Account page."
privacy_sec_localdata_li4:
  other: "Preferences: Selected color theme, interface language, game modifiers (such as extensive mode and daily level reduction), and onboarding tutorial progress."
privacy_sec_localdata_p2:
  other: "This information remains entirely on your device. It is never transmitted to us or any third party."
privacy_sec_thirdparty_title:
  other: "3. Technical Data & Third-Party Providers"
privacy_sec_thirdparty_p1:
  other: "When you visit {brand}, your web browser connects to third-party infrastructure providers to download the website files, fonts, character stroke data, and public decks. These providers may process technical connection data (such as your IP address, browser User-Agent, and request timestamps) strictly for the purpose of transmitting content and securing network operations:"
privacy_sec_thirdparty_li1:
  other: "GitHub Pages (GitHub, Inc. / Microsoft): Static web hosting for the site application files."
privacy_sec_thirdparty_li2:
  other: "jsDelivr CDN (ProspectOne / Cloudflare): Content Delivery Network used to distribute stroke animations, stroke databases, and public deck repositories."
privacy_sec_thirdparty_li3:
  other: "Google Fonts (Google LLC): Distribution of the open-source Ubuntu typeface."
privacy_sec_thirdparty_p2:
  other: "These providers process technical metadata in accordance with their respective privacy policies and under the international data transfer mechanisms that apply to them (such as the EU-U.S. Data Privacy Framework and its UK Extension, and standard contractual clauses)."
privacy_sec_legal_title:
  other: "4. Legal Bases for Processing (Art. 6 UK GDPR / EU GDPR)"
privacy_sec_legal_p1:
  other: "Under Article 6(1) of the UK GDPR and of the EU GDPR, the limited technical processing required to deliver the website relies on:"
privacy_sec_legal_li1:
  other: "Article 6(1)(b) (Performance of a Contract / Service Delivery): Processing technical requests necessary to provide the web app and its interactive character practice tools upon your visit."
privacy_sec_legal_li2:
  other: "Article 6(1)(f) (Legitimate Interests): The legitimate interest of maintaining website availability, fast CDN delivery, system integrity, and protection against network attacks or abuse."
privacy_sec_cookies_title:
  other: "5. Cookies & Tracking Technologies"
privacy_sec_cookies_p1:
  other: "{brand} does not use any tracking cookies, analytics cookies, targeting cookies, or third-party advertising scripts. We do not track your behavior across websites, nor do we build personal user profiles."
privacy_sec_cookies_p2:
  other: "We utilize standard client-side storage technologies (IndexedDB, localStorage, and Service Worker Cache API) solely for strictly necessary technical functionality — storing your decks, keeping track of your revision levels, enabling offline practice as a Progressive Web App (PWA), and remembering your UI preferences. In accordance with the UK Privacy and Electronic Communications Regulations 2003 (PECR), the EU ePrivacy Directive (Directive 2002/58/EC) and the UK and EU GDPR, strictly necessary functional storage does not require a consent banner."
privacy_sec_rights_title:
  other: "6. Your Rights Under the UK and EU GDPR"
privacy_sec_rights_p1:
  other: "The UK GDPR - and, if you are in the European Economic Area, the EU GDPR - grants you specific rights concerning your data:"
privacy_sec_rights_li1:
  other: "Right of Access (Art. 15): You can view all data stored about your learning progress directly on the Deck and Account pages."
privacy_sec_rights_li2:
  other: "Right to Rectification (Art. 16): You have complete control to edit, correct, or rename any card, phrase, definition, or preference at any time directly in the application."
privacy_sec_rights_li3:
  other: "Right to Erasure (Art. 17 - 'Right to be Forgotten'): You can delete all your stored data immediately at any time by clicking the 'Clear account data' button on the Account page, or by clearing your browser's site data."
privacy_sec_rights_li4:
  other: "Right to Data Portability (Art. 20): You can export all your decks and phrases in machine-readable JSON format at any time using the Export Deck option on the Deck page."
privacy_sec_rights_li5:
  other: "Right to Restriction and Objection (Art. 18 & 21): Since no personal data is stored on remote servers, you can stop all local processing at any moment by closing the application or clearing local storage."
privacy_sec_rights_li6:
  other: "Right to Lodge a Complaint (Art. 77): Our lead supervisory authority is the UK Information Commissioner's Office (ICO), which you can contact at ico.org.uk. If you are in the European Economic Area you may instead complain to the supervisory authority of your own country (for example, the Commission for Personal Data Protection in Bulgaria - CPDP / КЗЛД)."
privacy_sec_security_title:
  other: "7. Data Retention & Security"
privacy_sec_security_p1:
  other: "Your learning data remains saved in your browser until you choose to erase it, reset your account, or clear your browser's site data. Because your data is stored locally within the browser origin sandbox and never sent to a central server database, it is protected against central database breaches, and Heapforge Ltd never holds a copy of it."
privacy_sec_children_title:
  other: "8. Children's Privacy"
privacy_sec_children_p1:
  other: "{brand} is a safe, educational learning environment suitable for learners of all ages. We do not collect, request, or store personal information from children or any other users, and since nothing is profiled, advertised or nudged, the app is built in line with the ICO's Age Appropriate Design Code."
privacy_sec_transfers_title:
  other: "9. International Data Transfers"
privacy_sec_transfers_p1:
  other: "External infrastructure and CDN providers (GitHub, Google, Cloudflare) operate global networks and data centres. To the extent technical connection metadata is processed outside the United Kingdom or the European Economic Area (EEA), those transfers are covered by the UK's adequacy regulations and by the International Data Transfer Agreement (IDTA) or the UK Addendum to the European Commission's standard contractual clauses (SCCs); for visitors in the EEA they are covered by the SCCs and adequacy decisions adopted by the European Commission."
privacy_sec_contact_title:
  other: "10. Changes to This Policy & Contact"
privacy_sec_contact_p1:
  other: "We may update this Privacy Policy periodically to reflect improvements to the application or legal developments. Any changes will be posted on this page with a revised 'Last updated' date."
privacy_sec_contact_p2:
  other: "If you have questions, feedback, or inquiries regarding this Privacy Policy or the security of {brand}, you can write to Heapforge Ltd at the registered address in section 1, or open an issue on our official GitHub repository:"
privacy_contact_github:
  other: "Visit {brand} on GitHub"
