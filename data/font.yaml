# Ubuntu, self-hosted. Replaces the <link> to fonts.googleapis.com and the woff2 fetch from
# fonts.gstatic.com — two cross-origin hosts (plus two preconnects) on the critical path.
#
# Only weight 400 is vendored because that is all the site ever downloaded: the old request was
# `css2?family=Ubuntu&display=swap` with no weight axis, so Google served 400 alone and the browser
# synthesised the 500/600/700 the stylesheets ask for. Vendoring more weights would change rendering.
#
# The unicode-range values are copied verbatim from Google's own css2 response so subsetting
# behaves identically. Bulgarian needs cyrillic, Romanian needs latin-ext, and greek is kept
# because deck lists render Greek letters as text.
family: Ubuntu
weight: 400
base: https://cdn.jsdelivr.net/npm/@fontsource/ubuntu@5.3.0/files
subsets:
  - name: cyrillic-ext
    unicodeRange: "U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F"
  - name: cyrillic
    unicodeRange: "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"
  - name: greek-ext
    unicodeRange: "U+1F00-1FFF"
  - name: greek
    unicodeRange: "U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF"
  - name: latin-ext
    unicodeRange: "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"
  - name: latin
    unicodeRange: "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
