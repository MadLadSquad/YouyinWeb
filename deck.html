<!DOCTYPE html>
<html lang="en">
    <head>
        {{ include Components/head.tmpl.html }}
        <link rel="canonical" href="./{{ _ locale }}deck.html">
        <meta property="og:url" content="./{{ _ locale }}deck.html">
        <link rel="stylesheet" href="./styles/components/card.css" type="text/css">
        <link rel="stylesheet" href="./styles/components/writer.css" type="text/css">
        <link rel="stylesheet" href="./styles/components/button.css" type="text/css">
        <link rel="stylesheet" href="./styles/components/page-search.css" type="text/css">
        <link rel="stylesheet" href="./styles/pages/deck.css" type="text/css">

        <title class="site-title">{{ _ no_cards_link_deck }} | {{ trademark }} </title>
    </head>
    <body>
        {{ include Components/header.tmpl.html }}
        <main id="main-content" class="wrap deck-page">
            <!-- Deferred: nothing needs HanziWriter until the first card hover (resting cards are
                 hand-built SVG), so it must not block initial parse/render of the deck -->
            <script defer src="https://cdn.jsdelivr.net/npm/hanzi-writer/dist/hanzi-writer.min.js"></script>

            <div class="page-head">
                <div>
                    <h1 class="t-display">{{ _ no_cards_link_deck }}</h1>
                    <p class="t-meta" id="deck-summary"></p>
                </div>
                <!-- The six equally-loud accent buttons that used to fill a "+" tile: the two that
                     create something stay visible, the rest move into the overflow menu -->
                <div class="page-head-actions">
                    <button id="new-card-button" class="card-button-edit">
                        <svg class="icon icon-sm" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                            <path d="M10 4.5v11M4.5 10h11"></path>
                        </svg>
                        {{ _ new-card-button }}
                    </button>
                    <button id="new-phrase-button" class="card-button-edit card-button-secondary">{{ _ new-phrase-button }}</button>
                    <div class="overflow-menu">
                        <button type="button" id="deck-more-button" class="card-button-edit card-button-secondary card-button-icon" aria-haspopup="dialog" aria-expanded="false" aria-label="{{ _ deck_more_actions }}" title="{{ _ deck_more_actions }}">
                            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                                <circle cx="5" cy="10" r="1.35" fill="currentColor" stroke="none"></circle>
                                <circle cx="10" cy="10" r="1.35" fill="currentColor" stroke="none"></circle>
                                <circle cx="15" cy="10" r="1.35" fill="currentColor" stroke="none"></circle>
                            </svg>
                        </button>
                        <div id="deck-more-popup" class="list-select-popup overflow-popup" role="dialog" aria-label="{{ _ deck_more_actions }}">
                            <input type="file" id="fileupload" accept="application/json"/>
                            <button type="button" id="import-deck-button" class="card-button-edit card-button-ghost overflow-option">
                                <svg class="icon icon-sm" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                                    <path d="M10 12.9v-9M6.3 7.2 10 3.5l3.7 3.7M4 16.5h12"></path>
                                </svg>
                                {{ _ import-deck-button }}
                            </button>
                            <button type="button" id="export-deck-button" class="card-button-edit card-button-ghost overflow-option">
                                <svg class="icon icon-sm" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                                    <path d="M10 3.5v9M6.3 9.2 10 12.9l3.7-3.7M4 16.5h12"></path>
                                </svg>
                                {{ _ export-deck-button }}
                            </button>
                            <hr class="hairline overflow-separator">
                            <button type="button" id="clear-deck-button" class="card-button-edit card-button-ghost overflow-option overflow-option-danger">
                                <svg class="icon icon-sm" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                                    <path d="M4.5 6h11M8 6V4.6h4V6M6 6l.7 10h6.6L14 6"></path>
                                </svg>
                                {{ _ clear-deck-button }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-toolbar">
                <div class="page-search-wrapper">
                    <svg class="icon icon-sm page-search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                        <circle cx="9" cy="9" r="5.2"></circle>
                        <path d="m12.8 12.8 3.4 3.4"></path>
                    </svg>
                    <input type="search" id="deck-search" class="page-search" placeholder="{{ _ deck_search_placeholder }}" aria-label="{{ _ deck_search_placeholder }}" autocomplete="off">
                </div>
            </div>

            <!-- The id lives on the wrapper, not the label: deck.js hides or removes this whole
                 element when the list is empty or filtered out, and the rule should go with it -->
            <div class="section-head" id="deck-phrases-header">
                <p class="t-eyebrow">{{ _ deck-phrases-header }}</p>
                <span class="chip section-count" id="deck-phrases-count"></span>
                <hr class="hairline section-head-rule">
            </div>
            <section class="deck" id="deck-phrases-section">
                <!-- Data will be inserted dynamically by the Javascript here from the deck.js file -->
            </section>
            <div class="section-head" id="deck-characters-header">
                <p class="t-eyebrow">{{ _ deck-characters-header }}</p>
                <span class="chip section-count" id="deck-characters-count"></span>
                <hr class="hairline section-head-rule">
            </div>
            <section class="deck" id="deck-characters-section">
                <!-- Data will be inserted dynamically by the Javascript here from the deck.js file -->
            </section>
        </main>
        <!-- Loaded BEFORE the footer (which runs index.js then tutorial.js): these only DEFINE functions
             that index.js's main() and tutorial.js's dispatch call from async/promise continuations. Those
             microtasks drain between script tags, so the definitions must exist before the footer runs —
             a script placed after the footer would be too late -->
        <script src="./scripts/data/character-database.js"></script>
        <script src="./scripts/components/tutorial/deck.js"></script>
        {{ include Components/footer.tmpl.html }}
        <!-- Loaded AFTER the footer: these CONSUME the readiness promises (storageReady,
             profileReady, charDataReady) that index.js creates, so index.js must run first -->
        <script src="./scripts/components/writer.js"></script>
        <script src="./scripts/utils/format.js"></script>
        <script src="./scripts/utils/fuzzy-match.js"></script>
        <script src="./scripts/components/card-search.js"></script>
        <script src="./scripts/pages/deck.js"></script>
    </body>
</html>
