  - id: privacy_sec_controller_title
    text: "1. Prezentare generală și operatorul de date"
  - id: privacy_sec_controller_p1
    text: "{brand} este o aplicație web educațională cu sursă deschisă, dedicată sprijinirii celor care învață și exersează scrierea de mână a caracterelor din diverse sisteme de scriere. Site-ul web este operat de Heapforge Ltd, o companie înregistrată în Anglia și Țara Galilor. Heapforge Ltd este operatorul de date pentru acest site conform Regulamentului general privind protecția datelor din Regatul Unit (UK GDPR) și Data Protection Act 2018, iar - pentru vizitatorii din Spațiul Economic European - conform Regulamentului general privind protecția datelor din UE (Regulamentul (UE) 2016/679)."
  - id: privacy_sec_controller_p2
    text: "Deoarece {brand} funcționează ca o aplicație statică, pe partea de client, fără conturi de utilizator sau baze de date pe server, nu colectăm, nu stocăm, nu vindem și nu prelucrăm date cu caracter personal pe niciun server la distanță."
  - id: privacy_controller_company_label
    text: "Companie"
  - id: privacy_controller_number_label
    text: "Număr de înregistrare Companies House"
  - id: privacy_controller_address_label
    text: "Sediu social"
  - id: privacy_sec_controller_p3
    text: "Deoarece nicio dată cu caracter personal nu ajunge la noi, Heapforge Ltd nu a numit un responsabil cu protecția datelor și nu a desemnat un reprezentant în Spațiul Economic European în conformitate cu articolul 27 din GDPR UE. Solicitările scrise pot fi trimise la adresa sediului social menționată mai sus; la întrebările privind această politică se răspunde cel mai rapid prin intermediul depozitului GitHub menționat la sfârșitul acesteia."
  - id: privacy_sec_localdata_title
    text: "2. Date stocate pe dispozitivul tău"
  - id: privacy_sec_localdata_p1
    text: "Toate datele aplicației generate în timpul învățării sunt salvate local în spațiul de stocare persistent al browserului tău (IndexedDB și localStorage). Aceste date includ:"
  - id: privacy_sec_localdata_li1
    text: "Carduri și fraze: Definițiile caracterelor, pronunțiile, selecțiile de variante regionale și frazele personalizate pe care le creezi sau le imporți."
  - id: privacy_sec_localdata_li2
    text: "Statistici de studiu: Istoricul recapitulărilor, numărul de erori, nivelurile de cunoaștere, seriile zilnice, soldul de înghețări ale seriei și recompensele în nestemate."
  - id: privacy_sec_localdata_li3
    text: "Calendar de activitate: Numărul zilnic de sesiuni utilizat pentru a genera harta termică a practicii tale pe pagina Cont."
  - id: privacy_sec_localdata_li4
    text: "Preferințe: Tema de culori selectată, limba interfeței, modificatorii de joc (cum ar fi modul extins și reducerea zilnică a nivelului) și progresul în tutorialul introductiv."
  - id: privacy_sec_localdata_p2
    text: "Aceste informații rămân în întregime pe dispozitivul tău. Ele nu sunt niciodată transmise către noi sau către terți."
  - id: privacy_sec_thirdparty_title
    text: "3. Date tehnice și furnizori terți"
  - id: privacy_sec_thirdparty_p1
    text: "Când vizitezi {brand}, browserul tău web se conectează la furnizori terți de infrastructură pentru a descărca fișierele site-ului, fonturile, datele despre liniile caracterelor și pachetele publice. Acești furnizori pot prelucra date tehnice de conectare (cum ar fi adresa ta IP, User-Agent-ul browserului și marcajele temporale ale solicitărilor) strict în scopul transmiterii conținutului și securizării operațiunilor de rețea:"
  - id: privacy_sec_thirdparty_li1
    text: "GitHub Pages (GitHub, Inc. / Microsoft): Găzduire web statică pentru fișierele aplicației site-ului."
  - id: privacy_sec_thirdparty_li2
    text: "jsDelivr CDN (ProspectOne / Cloudflare): Rețea de distribuție a conținutului (CDN) utilizată pentru a distribui animațiile liniilor, bazele de date cu linii și depozitele publice de pachete."
  - id: privacy_sec_thirdparty_li3
    text: "Google Fonts (Google LLC): Distribuirea fontului open-source Ubuntu."
  - id: privacy_sec_thirdparty_p2
    text: "Acești furnizori prelucrează metadate tehnice în conformitate cu propriile politici de confidențialitate și în baza mecanismelor internaționale de transfer de date aplicabile (cum ar fi Cadrul de confidențialitate a datelor UE-SUA și extinderea sa pentru Regatul Unit, precum și clauzele contractuale standard)."
  - id: privacy_sec_legal_title
    text: "4. Temeiuri juridice pentru prelucrare (Art. 6 GDPR UK / GDPR UE)"
  - id: privacy_sec_legal_p1
    text: "În conformitate cu articolul 6 alineatul (1) din GDPR UK și din GDPR UE, prelucrarea tehnică limitată necesară pentru furnizarea site-ului web se bazează pe:"
  - id: privacy_sec_legal_li1
    text: "Articolul 6 alineatul (1) litera (b) (Executarea unui contract / Furnizarea serviciilor): Prelucrarea cererilor tehnice necesare pentru furnizarea aplicației web și a instrumentelor sale interactive de exersare a caracterelor la vizitarea site-ului."
  - id: privacy_sec_legal_li2
    text: "Articolul 6 alineatul (1) litera (f) (Interese legitime): Interesul legitim de a menține disponibilitatea site-ului web, livrarea rapidă prin CDN, integritatea sistemului și protecția împotriva atacurilor sau abuzurilor de rețea."
  - id: privacy_sec_cookies_title
    text: "5. Module cookie și tehnologii de urmărire"
  - id: privacy_sec_cookies_p1
    text: "{brand} nu utilizează module cookie de urmărire, cookie-uri de analiză, cookie-uri de direcționare sau scripturi publicitare terțe. Nu îți urmărim comportamentul pe alte site-uri web și nu construim profiluri personale de utilizator."
  - id: privacy_sec_cookies_p2
    text: "Utilizăm tehnologii standard de stocare pe partea de client (IndexedDB, localStorage și Service Worker Cache API) exclusiv pentru funcționalități tehnice strict necesare — stocarea pachetelor tale, urmărirea nivelurilor de recapitulare, permiterea exersării offline ca Aplicație Web Progresivă (PWA) și memorarea preferințelor tale de interfață. În conformitate cu Reglementările privind confidențialitatea și comunicațiile electronice din Regatul Unit din 2003 (PECR), Directiva UE privind confidențialitatea în mediul electronic (Directiva 2002/58/CE) și GDPR din Regatul Unit și UE, stocarea funcțională strict necesară nu necesită un banner de consimțământ."
  - id: privacy_sec_rights_title
    text: "6. Drepturile tale conform GDPR UK și UE"
  - id: privacy_sec_rights_p1
    text: "GDPR din Regatul Unit - și, dacă vă aflați în Spațiul Economic European, GDPR UE - vă conferă drepturi specifice privind datele dumneavoastră:"
  - id: privacy_sec_rights_li1
    text: "Dreptul de acces (art. 15): Puteți vizualiza toate datele stocate despre progresul dumneavoastră de învățare direct pe paginile Pachet și Cont."
  - id: privacy_sec_rights_li2
    text: "Dreptul la rectificare (art. 16): Aveți control total pentru a edita, corecta sau redenumi orice card, frază, definiție sau preferință în orice moment, direct în aplicație."
  - id: privacy_sec_rights_li3
    text: "Dreptul la ștergere (art. 17 - 'Dreptul de a fi uitat'): Puteți șterge imediat toate datele stocate, în orice moment, apăsând butonul 'Șterge datele contului' de pe pagina Cont sau ștergând datele site-ului din browser."
  - id: privacy_sec_rights_li4
    text: "Dreptul la portabilitatea datelor (art. 20): Puteți exporta oricând toate pachetele și frazele într-un format JSON ușor de citit automat, utilizând opțiunea Exportă de pe pagina Pachet."
  - id: privacy_sec_rights_li5
    text: "Dreptul la restricționare și opoziție (art. 18 și 21): Deoarece nu sunt stocate date cu caracter personal pe servere la distanță, puteți opri orice prelucrare locală în orice moment prin închiderea aplicației sau ștergerea stocării locale."
  - id: privacy_sec_rights_li6
    text: "Dreptul de a depune o plângere (art. 77): Autoritatea noastră principală de supraveghere este Information Commissioner's Office (ICO) din Regatul Unit, pe care o puteți contacta la ico.org.uk. Dacă vă aflați în Spațiul Economic European, puteți depune o plângere la autoritatea de supraveghere din țara dumneavoastră (de exemplu, Autoritatea Națională de Supraveghere a Prelucrării Datelor cu Caracter Personal din România - ANSPDCP)."
  - id: privacy_sec_security_title
    text: "7. Păstrarea datelor și securitatea"
  - id: privacy_sec_security_p1
    text: "Datele tale de învățare rămân salvate în browser până când alegi să le ștergi, să îți resetezi contul sau să ștergi datele site-ului din browser. Deoarece datele tale sunt stocate local în cadrul sandbox-ului de origine al browserului și nu sunt trimise niciodată către o bază de date centrală de server, acestea sunt protejate împotriva breșelor bazelor de date centrale, iar Heapforge Ltd nu deține niciodată o copie a acestora."
  - id: privacy_sec_children_title
    text: "8. Confidențialitatea datelor minorilor"
  - id: privacy_sec_children_p1
    text: "{brand} este un mediu educațional sigur, potrivit pentru cursanți de toate vârstele. Nu colectăm, nu solicităm și nu stocăm informații cu caracter personal de la copii sau de la orice alți utilizatori și, deoarece nimic nu este profilat, promovat publicitar sau direcționat subtil, aplicația este construită în conformitate cu Age Appropriate Design Code al ICO."
  - id: privacy_sec_transfers_title
    text: "9. Transferuri internaționale de date"
  - id: privacy_sec_transfers_p1
    text: "Furnizorii externi de infrastructură și CDN (GitHub, Google, Cloudflare) operează rețele globale și centre de date. În măsura în care metadatele tehnice de conectare sunt prelucrate în afara Regatului Unit sau a Spațiului Economic European (SEE), aceste transferuri sunt acoperite de reglementările de adecvare ale Regatului Unit și de Acordul internațional de transfer de date (IDTA) sau de Anexa Regatului Unit la clauzele contractuale standard (SCC) ale Comisiei Europene; pentru vizitatorii din SEE, acestea sunt acoperite de SCC și de deciziile de adecvare adoptate de Comisia Europeană."
  - id: privacy_sec_contact_title
    text: "10. Modificări ale acestei politici și contact"
  - id: privacy_sec_contact_p1
    text: "Putem actualiza periodic această Politică de confidențialitate pentru a reflecta îmbunătățirile aduse aplicației sau evoluțiile legislative. Orice modificări vor fi publicate pe această pagină cu o dată revizuită a 'Ultimei actualizări'."
  - id: privacy_sec_contact_p2
    text: "Dacă aveți întrebări, feedback sau solicitări referitoare la această Politică de confidențialitate sau la securitatea {brand}, puteți scrie companiei Heapforge Ltd la adresa sediului social din secțiunea 1 sau puteți deschide o sesizare pe depozitul nostru oficial de pe GitHub:"
  - id: privacy_contact_github
    text: "Vizitează {brand} pe GitHub"
